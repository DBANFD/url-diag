name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: url-diag.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: url-diag
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: url-diag
          - os: macos-15
            target: aarch64-apple-darwin
            binary: url-diag
          # New targets. They may fail without blocking the release until proven.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: url-diag.exe
            experimental: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: url-diag
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test executable
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help
      - name: Package approved files
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py --target ${{ matrix.target }} --tag "$RELEASE_TAG"
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # The four established targets are required; the two new ones are optional.
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test "$(find . -maxdepth 1 -name "*-$target.*.sha256" | wc -l)" -eq 1
          done
          cat *.sha256 | tr -d '\r' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          shopt -s nullglob
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "URL Diag $RELEASE_TAG" --notes-file RELEASE_NOTES.md dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt
