name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: url-diag.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: url-diag
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: url-diag
          - os: macos-15
            target: aarch64-apple-darwin
            binary: url-diag
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust stable
        run: rustup toolchain install stable --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo +stable test --locked --target ${{ matrix.target }}
      - run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Smoke test executable
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help
      - name: Package approved files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py --target ${{ matrix.target }} --tag "$env:RELEASE_TAG"
        if: runner.os == 'Windows'
      - name: Package approved files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py --target ${{ matrix.target }} --tag "$RELEASE_TAG"
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cat *.sha256 | tr -d '\r' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "URL Diag $RELEASE_TAG" --notes-file RELEASE_NOTES.md dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt
