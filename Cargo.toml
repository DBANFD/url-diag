[package]
name = "url-diag"
version = "0.2.0"
edition = "2024"
description = "Evidence-oriented direct cloud connectivity diagnostics"
license = "MIT"

[dependencies]
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
futures = "0.3"
humantime = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "process", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"

tempfile = "3"

[dev-dependencies]
rcgen = "0.14"
